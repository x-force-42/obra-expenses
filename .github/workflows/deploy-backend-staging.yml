name: Deploy Backend Staging

on:
  workflow_dispatch:

concurrency:
  group: deploy-backend-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy backend on staging EC2
    runs-on: [self-hosted, linux, x64, obra-expenses-staging]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t obra-expenses-backend:staging ./backend

      - name: Prepare deploy directory
        run: |
          set -euo pipefail

          mkdir -p /opt/obra-expenses

          cp deploy/staging/docker-compose.staging.yml /opt/obra-expenses/
          cp deploy/staging/Caddyfile /opt/obra-expenses/
          cp deploy/staging/.env.example /opt/obra-expenses/
          cp deploy/staging/README.md /opt/obra-expenses/

      - name: Validate environment file
        run: |
          set -euo pipefail

          if [ ! -f /opt/obra-expenses/.env ]; then
            echo "::error::Missing /opt/obra-expenses/.env. Create it manually on the EC2 instance before running this workflow."
            exit 1
          fi

      - name: Deploy with Docker Compose
        run: |
          set -euo pipefail

          cd /opt/obra-expenses
          docker compose --env-file .env -f docker-compose.staging.yml up -d
          docker image prune -f
