spring:
  application:
    name: obra-expenses
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/obra_expenses}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

server:
  servlet:
    context-path: /api

app:
  security:
    jwt-secret: ${JWT_SECRET:replace-me}
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:replace-me}

